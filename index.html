<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juan Kalebe - Elétrica</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-dark: #1e40af;
            --bg: #f8fafc;
            --text: #334155;
            --text-dark: #0f172a;
            --border: #e2e8f0;
            --accent: #f59e0b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 32px 16px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        header p {
            font-size: 0.9rem;
            opacity: 0.9;
            max-width: 400px;
            margin: 0 auto;
        }
        main {
            flex: 1;
            padding: 24px 16px;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }
        .intro-text {
            font-size: 0.95rem;
            text-align: center;
            color: #64748b;
            margin-bottom: 24px;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .menu-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.02);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            border-left: 5px solid var(--primary);
        }
        .menu-card:active, .menu-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgb(0 0 0 / 0.05);
        }
        .menu-card.tipo2 {
            border-left-color: var(--accent);
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-title::after {
            content: "→";
            font-size: 1.2rem;
            color: #94a3b8;
            transition: transform 0.2s;
        }
        .menu-card:active .card-title::after {
            transform: translateX(4px);
            color: var(--primary);
        }
        .card-desc {
            font-size: 0.88rem;
            color: #64748b;
        }
        footer {
            text-align: center;
            padding: 20px 16px;
            font-size: 0.85rem;
            color: #64748b;
            border-top: 1px solid var(--border);
            background: white;
        }
        .footer-name {
            font-weight: 600;
            color: var(--primary);
            margin-top: 4px;
            display: block;
        }
    </style>
</head>
<body>

<header>

</header>

        </a>

        <!-- Link para o Tipo 2 -->

        </a>

            <div class="card-title">CADe_SIMU 4.0 [BR] / Drive</div>
            <div class="card-desc">Clique aqui para acessar o arquivo CADe_SIMU 4.0 [BR].</div>
        </a>
    </div>
</main>

<footer>

    <span class="footer-name">Responsável: Juan Kalebe</span>

</html>
